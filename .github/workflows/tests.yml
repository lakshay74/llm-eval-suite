name: LLM eval tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run test suite
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}   # add in repo Settings > Secrets; without it, runs in mock mode
        run: python -m pytest -v
      - name: Show summary
        if: always()
        run: cat results/summary.md >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: results/
